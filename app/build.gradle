plugins {
  id 'com.android.application'
}

android {
  compileSdk 34
  namespace "com.amr.terra"

  defaultConfig {
    applicationId "com.amr.terra"
    minSdk 21
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_9
    targetCompatibility JavaVersion.VERSION_1_9
  }
}

dependencies {
}
